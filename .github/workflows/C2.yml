name: C2

permissions:
  contents: write

on:
  schedule:
    # Setiap 30 menit, offset 2 (menit 02 dan 32).
    - cron: '2-59/30 * * * *'
  workflow_dispatch:

concurrency:
  # Semua workflow penulis README berbagi grup ini agar tidak saling bentrok.
  group: readme-updater
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Configure Git
        run: |
          git config user.name "antono4"
          git config user.email "antonockr1@gmail.com"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TZ="Asia/Jakarta"
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S %Z")
          MSG="Auto update README at $(date +'%Y-%m-%d %H:%M:%S') WIB"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"

            [ -f README.md ] || : > README.md
            # Buang stempel waktu lama agar tidak menumpuk, lalu tulis yang baru.
            grep -v '^Last updated: ' README.md > README.tmp || true
            mv README.tmp README.md
            printf 'Last updated: %s\n' "$TIMESTAMP" >> README.md

            git add README.md
            if git diff --staged --quiet; then
              echo "Tidak ada perubahan pada README."
              exit 0
            fi

            git commit --quiet -m "$MSG"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Push berhasil pada percobaan $attempt."
              exit 0
            fi
            echo "Push ditolak, mencoba lagi (percobaan $attempt)."
            sleep $((attempt * 2))
          done

          echo "Gagal push setelah 5 percobaan." >&2
          exit 1
